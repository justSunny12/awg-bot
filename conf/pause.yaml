# conf/pause.yaml — приостановка подписки клиентом («в отпуск»). При входе
# тикание останавливается (period_end сдвигается вперёд), при выходе —
# пересчитывается по фактической длине. Дни паузы — счёт у профиля:
#   годовая     — +pause_max_total_days при создании на год и при каждом
#                 продлении на год (даже несвоевременном), накопление до двух;
#   ежемесячная — +monthly_pause_days за каждый своевременно оплаченный месяц
#                 (создание и продление, пока подписка не истекла и без
#                 отсрочки), накопление до 12 таких;
#   смена типа  — остаток переносится в пределах максимума нового типа;
#   день/неделя — счёт не пополняется, накопленное живёт; бессрочно — ноль.

pause_max_total_days: 28    # годовая: дней за продление на год (максимум — ×2)
monthly_pause_days: 2       # ежемесячная: дней за своевременное продление (максимум — ×12)
