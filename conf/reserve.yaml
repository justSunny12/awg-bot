# conf/reserve.yaml — взаимный резерв серверов AWG (раздел «🛟 Резерв») и его
# кворум. Горячие ключи: бот читает их по месту. Пороги живости и ожидания —
# в секундах и минутах. До 4.2.0 — раздел reserve в app.yaml: бот при старте
# переносит его сюда сам (core/settings, перенос раздела); ключ moved_from, если
# появится, — служебная отметка переноса, когда app.yaml не разбирается на запись.
# Шим переноса снимается, когда и UPDATE_FROM, и COMPAT_FLOOR (core/compat) не
# ниже 4.2.0, — вместе со снятием копии раздела из живых app.yaml.

ready: false                     # «Готов быть резервом» — симметричный тумблер
return: immediate                # immediate | button — рычаг возврата пользователей на основу
rf_via_mine: true                # РФ-доступ пользователей второго сервера через мои шлюзы, если его шлюзы не отвечают: запасной слот в зоне и РФ-транзит
pair_cidr: "10.99.98.0/30"       # линк пары сервер ↔ сервер
pair_port: 47101                 # UDP-порт линка пары на этом сервере (у второй стороны — свой)
pair_channel_port: 8788          # TCP-порт канала пары внутри линка (канал шлюзов — 8787)
zone_cidr: "169.254.77.0/30"     # veth хост ↔ гостевая зона (только в переезде)
zone_rf_cidr: "169.254.77.4/30"  # второй veth — РФ-трафик пользователей основы к моим шлюзам
zone_tg_cidr: "169.254.77.8/30"  # третий veth (постоянный) — выход агентов шлюзов основы в Telegram при мёртвом аплинке
zone_pool: "169.254.96.0/19"     # NETMAP: подсеть каждого клона основы — на свой блок здесь (CAKE делит загрузку по устройствам)
rsv_cidrs: ["10.99.97.0/30", "10.99.97.4/30"]   # постоянные линки шлюзов основы (стороны в зоне)
suspect_seconds: 40              # тишина линка до подозрения
probe_seconds: 15                # активная проба после подозрения
rf_block_minutes: 15             # случай 3 кворума: кандидат сам видит сервер, а голосующие — нет; столько ждёт до решения
ask_seconds: 60                  # столько кандидат ждёт ответа лидера на просьбу ask{q}, потом открывает по точкам
notify_online_minutes: 15        # уведомления пользователям — только устройствам на связи за столько минут
pkg_minutes: 30                  # пакет по таймеру (± 40 %)
min_interval_minutes: 30         # между переключением и возвратом «сразу»; у резерва — между автоматическими переездами
healthy_seconds: 300             # мои пользователи у резерва: моя сторона здорова столько подряд — возврат «сразу» (под кворумом — по счёту Q2)
relay_idle_hours: 2              # пересылка хвоста: тишина, после которой снимается
relay_max_days: 7                # пересылка хвоста: не дольше
tg_pool_asns: [62041, 62014, 59930, 44907, 211157]   # AS Telegram: проверка ядра и обучение пула вебхука
tg_pool_url: "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS{asn}"
tg_pool_hours: 24                # обновление кэша анонсов: раз в столько ± 40 %, только пока есть пара
                                 # (вне расписания — sudo awg-bot reserve tgpool refresh)
tg_pool_max: 256                 # потолок выученных префиксов пула
tg_pool_learn_syn: 3             # обучение: столько SYN на порт вебхука за 10 мин
tg_pool_stale_days: 3            # анонсы не обновлялись дольше — уведомление и «⚠️» в строке пула
quorum:                          # кворум: о переезде решает большинство — второй сервер и шлюзы основы (зонды в awg-quo)
  port: 8789                     # UDP-порт ответчика на втором адресе интерфейса AWG (8787 — канал шлюзов, 8788 — пары)
  probe_seconds: 15              # интервал пробы (± 40 %)
  no_seconds: 45                 # «не вижу»: ответа нет столько
  yes_window_seconds: 40         # окно «да» у лидера
  down_seconds: 20               # лишение кворума: «да» меньше половины столько
  up_seconds: 100                # решение кандидата: «нет» больше половины столько (≥ yes_window + down + 20)
  unfence_seconds: 30            # лишённый кворума лидер: «да» не меньше половины столько подряд — снова лидер
  ask_repeat_seconds: 30         # повтор опроса кандидатом (± 40 %)
  grace_seconds: 120             # смена состава: голос прежнего поколения засчитан столько (≥ 1,4·probe + 3)
  pause_seconds: 300             # плановая пауза лидера (обновление, перезапуск) — не дольше
  tie_clear_seconds: 60          # ничьей нет столько — отбой
  pledge_minutes: 10             # обязательство «нет» — не дольше
  tie_minutes: 3                 # ничья — тревога через столько
