# conf/app.yaml — инфраструктура приложения (не бизнес-правила).
# Секреты (BOT_TOKEN, ADMIN_ID) СЮДА НЕ КЛАДЁМ — они только из окружения/.env.
# Крипто-материал AWG (ключи, psk, обфускация awg-протокола, порт) тоже не тут — его читает
# live из конфига интерфейса infra/awg/, чтобы не заводить второй источник истины.

# Часовой пояс показа времени: без ключа — пояс сервера (timedatectl), после
# смены пояса хоста — перезапуск бота. Ключ — явное переопределение именем из
# `timedatectl list-timezones`. Хранение в БД от пояса не зависит (UTC+3).
# timezone: "Europe/Moscow"

# AmneziaWG на хосте — deploy-параметры
awg:
  # Идентификатор протокола для приложения AmneziaVPN: уезжает в vpn:// и
  # разбирается на телефоне. Зашит во ВСЕ выданные ссылки — менять только
  # вместе с перевыпуском профилей всем (переезд профилей).
  protocol_id: "amnezia-awg2"
  interface: "awg0"
  conf_dir: "/etc/amnezia/amneziawg"   # каталог awg-quick

  # ── Переезд профилей (docs/ROADMAP.md, п.3) ────────────────────────────────
  # Второй интерфейс с новыми параметрами, поднятый рядом со старым на время
  # переезда: пока люди по одному переносят конфиги, работают оба.
  #
  # ПУСТО ⇒ переезда нет вовсе: рычаг в обслуживании не показывается, строк
  # прогресса нет, бот ходит на один интерфейс, как ходил. Это же и аварийный
  # рубильник — очистил ключи, перезапустил бота.
  #
  # Само наличие ключей переезд НЕ начинает: они лишь делают рычаг доступным.
  # Обязательны ОБА: интерфейс без подсети проверять нечем, подсеть без
  # интерфейса не к чему привязать.
  #
  # Своя подсеть у второго интерфейса не для красоты: комплекты пиров тогда не
  # пересекаются, аллокатор нового конфига видит только свои адреса, и забота
  # «двойной комплект должен помещаться в /24» исчезает.
  migration_interface: ""          # напр. "awg1"
  migration_subnet_prefix: ""      # напр. "10.9.1" → подсеть 10.9.1.0/24
  # DNS двойников в окне переезда: адрес резолвера на новом интерфейсе
  # (<новая подсеть>.1). Пишет бот при включении рычага, финал переносит в
  # client_config.dns1/dns2 и очищает. Пусто — двойники берут dns1/dns2.
  migration_dns: ""

# ── Роль установки (docs/ROADMAP.md, п.7) ───────────────────────────────────
# client  — бот при awg-сервере (умолчание, всё как всегда);
# gateway — агент на шлюзе условной маршрутизации: свой Telegram-токен,
#           наблюдаемость линка/обвязки/железа, никакой механики пользователей.
# role: "gateway"
# gateway:
#   link_interface: "awglink"      # линк до ВПС
#   conf_dir: "/etc/amnezia/amneziawg"
#   unit: "awg-link-gw.service"    # юнит реассерта обвязки
#   client_subnet: ""              # подсеть пользователей ВПС (для проверки MASQUERADE)
#   server_name: ""                # имя ВПС в панели («Линк до …»); пусто — из
#                                  # конфигурации шлюза (hostname ВПС), иначе «ВПС»
#   monitor_minutes: 3             # тик монитора
#   handshake_max_age: 300         # сек (в чате агента — минутами); старше — линк мёртв
#   link_alert_streak: 2           # тиков подряд до алерта по линку
#   egress_alert_streak: 2         # тиков подряд до алерта «не выходит наружу»
#   temp_alert_c: 75               # порог температуры SoC
#   link_alert_loud: true          # алерт простоя линка со звуком и в тихие часы
#   egress_targets: ["77.88.8.8", "8.8.8.8"]   # проба выхода наружу через канал шлюза
#   egress_port: 53
#   # Зонд наружу — последний довод, а не первый: сначала улики. Обратный
#   # трафик пользователей в линк доказывает путь даром; пользователи шлют, а обратно
#   # тихо — зондируем немедленно (это и есть отказ канала); не ходит никто —
#   # такт зонда умножается на это число, с джиттером ±40 %. Коннект с адреса
#   # шлюза к одной и той же цели каждые три минуты — сигнатура, а ждать
#   # ответа в простое всё равно некому. 0 — зондировать каждый тик.
#   egress_idle_multiplier: 4      # 4 × 3 мин ≈ 12 мин между зондами в простое
#   ipv4_only: true                # наружу только IPv4 (умолчание всех ролей и всех запросов); false — снять привязку у агента
#   # Резерв серверов (раздел reserve документа конфигурации): постоянный линк к
#   # резерву awgrsv, взгляды на основу и на резерв — пропуски keepalive и проба.
#   reserve_suspect_seconds: 40    # тишина линка до подозрения
#   reserve_probe_seconds: 15      # проба после подозрения (ping по каналу, запрос через аплинк)
#   guest_channel_port: 8787       # TCP-порт гостевого канала стороны зоны резерва
#   rf_block_minutes: 15           # только срок в уведомлении «если так останется до …»; решает демпфер резерва

# Сеть: сервер занимает .1, пользователи идут с .2 (установщик создаёт сервер сам).
# У установок прежней раскладки сервер на .0 и пользователи с .1 — их конфиг не
# мигрирует, там ip_host_start остаётся 1.
network:
  subnet_prefix: "10.8.1"
  subnet_cidr: "10.8.1.0/24"     # информационное
  ssh_port: 22                   # порт sshd хоста — его же фильтрует firewall (ниже)
  ip_host_start: 2                 # первый выдаваемый хост (.2); .1 — сервер
  ip_host_end: 254
  # ── ДЕПЛОЙ-ЗНАЧЕНИЯ ЭТОГО ХОСТА. Пустые в шаблоне — установщик заполнит под
  #    твои ответы (порт/подсеть подсосёт из живого конфига интерфейса автодетектом,
  #    хост — из ip route как подсказку). В эксплуатации правишь здесь, на
  #    холодную. ОБЯЗАТЕЛЬНЫ — при пустом значении бот падает на старте с
  #    указанием, что задать. ─────────────────────────────────────────────────
  server_host: ""                  # внешний адрес awg-сервера (IP или домен)
  self_host: ""                    # собственный адрес сервера (IP или второе имя, не переключаемое):
                                   # на него ходят линки шлюзов и линк пары резерва; пусто — как server_host
                                   # (пустой при сопряжении резерва бот фиксирует сам — IP записи server_host)
  server_port:                     # порт awg-сервера

# Файервол хоста — ЕДИНСТВЕННАЯ точка: nft-таблица awg_bot_guard, которую ведёт
# бот (README §6b). ufw и прочие слои на SSH-порту рядом с ней не нужны.
# Включается не здесь, а командой `awg-bot firewall setup` — она проверяет вход
# с таймером отката и только потом ставит enabled: true.
firewall:
  enabled: false
  ssh_allow: []                    # ВАШИ адреса для SSH: IP, CIDR или имя (DynDNS).
                                   # Пусто → SSH открыт всем адресам (только ключи).
                                   # Из туннеля SSH открыт устройствам админа — всегда.
  open_tcp: []                     # прочие входящие порты хоста, если что-то ещё
  open_udp: []                     # слушает (порты awg-интерфейсов открываются сами)

# Параметры конфигурации пользователя (из эталонного vpn:// приложения)
client_config:
  # ПРИВАТНЫЙ РЕЗОЛВЕР — цель, а не текущее значение. Публичный адрес в этом
  # поле Chrome молча апгрейдит до DoH (1.1.1.1 в его списке), и тогда перехват
  # :53 не видит ничего, а ipset условной маршрутизации нечем наполнять. Лечится
  # адресом, который не апгрейдит никто: `<подсеть интерфейса>.1` при аллокаторе,
  # сдвинутом на `.2` (ip_host_start ниже). ОБА поля — на него же: публичный
  # вторым номером возвращает утечку, потому что стеки опрашивают список не
  # строго по порядку.
  # В шаблоне — публичная заглушка: установщик поднимает dnsmasq на <подсеть>.1
  # (install/awg-resolver-setup.sh) и вписывает его сюда в оба поля. На живой
  # установке с публичным адресом бот предлагает перейти на свой резолвер —
  # это меняет каждую выданную ссылку, поэтому идёт через переезд профилей.
  dns1: "1.1.1.1"
  dns2: "1.0.0.1"
  mtu: 1376
  # PersistentKeepalive. ДИАПАЗОН, а не число: фиксированные 25 секунд — это
  # метроном ванильного WireGuard, и на простаивающем туннеле он виден без
  # всякой расшифровки. Остальные таймеры протокола джиттерит сам сервер
  # (RekeyAfterTime и соседи), а этот приходит из конфига бота — оставь его
  # числом, и вся работа по ломке ритма обнуляется самым заметным сигналом.
  # Диапазон разбирается тулзами AmneziaWG 3.x (u16_range_from_string) и
  # совпадает с дефолтом приложения. Приложению дореформенного поколения нужно
  # одиночное число — тогда ставь 25.
  keepalive_seconds: "25-35"
  allowed_ips: "0.0.0.0/0, ::/0"   # полный туннель на стороне устройства
  server_name: "Сервер 1"          # description в vpn:// (видно в приложении)
  # Резолвер админа («SMB в туннеле»): второй dnsmasq на этом адресе (/32 на
  # dummy-интерфейсе, install/awg-admin-dns-setup.sh). Новые конфиги устройств
  # админа (кроме шлюзовых) получают его в оба поля DNS. При раздельном
  # туннеле (allowed_ips выше без 0.0.0.0/0) в их AllowedIPs идёт строка
  # пространства адресов в туннеле (routing.lan_space, 10.240.0.0/12) — она
  # покрывает и этот адрес; /32 — только при резолвере вне этого пространства.
  # Адрес вне подсетей пользователей; :53 на нём файервол открывает только устройствам админа.
  admin_dns: "10.255.53.53"

# ── Условная маршрутизация (см. концепт «условная маршрутизация») ─────────────────
# Российский IP для российских сервисов: помеченный трафик уходит линк-туннелем
# на шлюз с РФ-адресом, остальное — обычным путём с этого сервера. Конфиги
# устройств при этом НЕ меняются: режим — серверное состояние, а не отдельные
# учётные данные.
#
# Пустой gw_interface ⇒ фича СПИТ целиком: тумблеры не показываются, наборы не
# создаются, планировщик её не трогает. Это же и аварийный рубильник.
routing:
  # ГОРЯЧИЙ выключатель функции — правится из «⚙️ Настройки → Условная
  # маршрутизация», применяется без рестарта. Выключение снимает маркировку и
  # чистит наборы, но пользовательские настройки (разрешения, тумблеры, списки)
  # сохраняет: включил обратно — всё вернулось как было.
  enabled: false
  gw_interface: ""                 # интерфейс линк-туннеля до шлюза (напр. "awggw")
  # «SMB в туннеле» (тумблер в «🛰 Шлюзы»): SMB-серверы локальных сетей шлюзов
  # видны по именам на устройствах админа в туннеле — резолвер админа отдаёт
  # их записи под awg.internal. Нужен свой резолвер пользователей и файервол.
  smb_tunnel: false
  # Всё на хосте, в одном месте: наборы, маркировка, ip rule, dnsmasq, линк до
  # шлюза и NAT пользователей (в таблице бота).
  # client_subnet НЕ задаётся: по умолчанию он выводится из network.subnet_prefix
  # и МЕНЯЕТСЯ ВМЕСТЕ С НИМ. Явное значение здесь замерзает: при смене подсети
  # пользователей (переезд профилей) его забывают, и доктор видит «нет маршрута до
  # старой подсети» — ровно так и случилось. Раскомментируй только если подсеть
  # маршрутизации ДОЛЖНА отличаться от подсети пользователей (нестандартная топология).
  # client_subnet: "10.8.1.0/24"   # подсеть пользователей: по ней хост отличает
                                   # немаскараженный трафик включённых устройств
  table: 100                       # номер таблицы маршрутизации для помеченного
  fwmark: 1                        # метка (маска та же — бит не затирает чужие)
  #
  # НА ШЛЮЗ ИДЁТ ТОЛЬКО ТО, ЧТО В НАБОРЕ. Набор перечисляет российские сервисы,
  # которым нужен российский адрес; всё прочее выходит зарубежным адресом
  # обычным путём. Отсюда: пустой набор безопасен (равносилен выключенной
  # функции), а отказ шлюза мягкий — «Озон ругается на адрес», а не «нет
  # интернета». Списки бот качает САМ, при старте и по расписанию.
  #
  # Набор наполняется ТОЛЬКО резолвером, через директивы ipset= в dnsmasq:
  # готовых списков российских подсетей не существует, все сопровождаемые — про
  # заграницу (CDN, хостеры). Значит механизм держится на том, что устройство
  # резолвит через нас; ушедший в DoH просто не получит режим.
  #
  # У КАЖДОГО ПРОФИЛЯ СВОЙ НАБОР = базовый список + его личные добавления.
  # Общего набора рядом с личными нет намеренно: dnsmasq применяет для домена
  # только ОДНУ директиву ipset=, и домен из базы, добавленный кем-то себе,
  # переставал бы попадать в общий — у остальных он уезжал бы на шлюз.
  #
  # ИМЁН НАБОРОВ И ЦЕПОЧЕК ЗДЕСЬ НЕТ намеренно — они константы в коде. Возможность
  # их настраивать создавала рассинхрон: боевой конфиг при обновлении не
  # мигрирует, и однажды прописанное имя переживало смену схемы, после чего бот
  # искал набор, которого никто не создаёт.
  #
  # Источники базового списка: домены российских сервисов, которым нужен
  # российский адрес. Только они и уходят на шлюз.
  lists_home_urls:
    - "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/outside-dnsmasq-ipset.lst"
    - "https://raw.githubusercontent.com/UnRKN/ru-blocklist/main/ru-blocklist.txt"
  lists_refresh_hours: 6            # как часто обновлять
  dnsmasq_conf: "/etc/dnsmasq.d/awgbot-routing.conf"   # генерится ботом ЦЕЛИКОМ
  dnsmasq_service: "dnsmasq"       # unit для restart (reload не применяет ipset=)
  user_domains_max: 100            # потолок личного списка на пользователя
  # Домены, запрещённые к добавлению в личный список (совпадение по суффиксу:
  # запрет на X закрывает и mail.X). Собственная инфраструктура добавляется сюда
  # автоматически из server_host и почтовых хостов — здесь только доп.записи.
  denylist: []
  # ЖИВОСТЬ ШЛЮЗА измеряется проходимостью, а не состоянием туннеля: бот пингует
  # probe_targets ЧЕРЕЗ линк. Возраст хендшейка отвечал бы на другой вопрос —
  # «поднят ли туннель», — а у шлюза может быть поднят туннель и лежать аплинк.

  # НЕСКОЛЬКО целей, а не одна: единственный внешний хост сам по себе точка
  # отказа — он может лечь или подтормаживать, и мы объявим отказом шлюза чужую
  # проблему. Успех любой означает, что путь наружу есть.
  probe_targets: ["77.88.8.8", "8.8.8.8"]
  probe_port: 53                   # TCP, а не ICMP: пинг проверял бы путь,
                                   # который на шлюзе никто не настраивал
  probe_seconds: 30                # такт проверки; он же — предел провала
                                   # (деградация: маркировка снимается)
  # ЗОНД — ПОСЛЕДНИЙ довод, а не первый. Сначала улики: вернувшийся через линк
  # трафик пользователей доказывает путь наружу сильнее любой пробы и не стоит ни
  # одного пакета. Спрос есть, а обратно тихо — зондируем каждый такт (это и
  # есть отказ аплинка шлюза). Через линк не ходит никто — такт зонда
  # умножается на это число (с джиттером ±40 %): коннект раз в полминуты с
  # адреса ВПС в одну и ту же цель сам по себе сигнатура, а ждать ответа в
  # простое всё равно некому. 0 — зондировать каждый такт (как было).
  probe_idle_multiplier: 10        # 10 × 30 с = 5 мин в простое — как у зонда резерва
  # РЕЗЕРВНЫЙ ШЛЮЗ (концепт «резервный шлюз»). Слоты шлюзов живут в БД и
  # заводятся из бота («➕ Резервный шлюз»); здесь — только то, что нужно
  # линку по номеру слота, и поведение автомата. Один шлюз — право, не
  # обязанность: без второго слота всё работает как прежде.
  # link_ports: [443, 8443]        # порт линка по слоту: второй — не 443 (занят
                                   # первым), 8443 так же теряется среди QUIC
  # link_cidrs: ["10.99.99.0/30", "10.99.99.4/30"]   # /30 линка по слоту
  # gateways_max: 2                # больше двух — смысл только при трёх площадках
  # АДРЕСА В ТУННЕЛЕ ДЛЯ ЛОКАЛЬНЫХ СЕТЕЙ ШЛЮЗОВ: у каждой подсети за шлюзом —
  # статическое зеркало в служебном пространстве сервера для доступа из туннеля,
  # по /16 на слот (слот 1 — 10.240.x.x, слот 2 — 10.241.x.x, …, слот 15 —
  # 10.254.x.x), два последних октета IP-адресов — те же, что в реальных.
  # Последняя /16 — служебные адреса сервера (10.255.53.53 — резолвер админа, 10.255.53.1 —
  # перехват DNS). Только частная /12; неверное значение — умолчание с
  # записью в журнал. Менять — только до первого шлюза или осознанно: смена переписывает
  # адреса сетей во всех конфигах и закладках. Пространство не должно
  # пересекаться с подсетью пользователей (и подсетью переезда) и с /30 линков.
  # lan_space: "10.240.0.0/12"
  # КАНАЛ ВПС ↔ ШЛЮЗ ВНУТРИ ЛИНКА (концепт «канал линка»): агент держит одно
  # TCP-соединение и отдаёт снимок состояния. Слушатель поднимается только на
  # адресах линков, порт открыт в таблице бота адресам шлюзов (набор
  # link_peers4) и никому больше. Канал обязателен: агент держит его, пока на
  # шлюзе есть конфиг линка; выключателя нет. Порт бандл вшивает строкой
  # LINK_CHANNEL_PORT из этого же ключа, так что слушатель и шлюз не разойдутся.
  # Сменил его — прежний порт сервер слушает ещё неделю, а новый агенту
  # везёт канал сам документом конфигурации.
  # link_channel_port: 8787
  failover:
    enabled: true                  # автоматическое переключение на резерв;
                                   # false — только руками из карточки слота
    min_interval_minutes: 10       # не чаще одного АВТОМАТИЧЕСКОГО переключения:
                                   # два подряд значат, что лежит общее, а не шлюз
    # Такт зонда (probe_seconds выше), ширина окна и порог — горячие, правятся
    # из ⚙️ Настройки → Условная маршрутизация → Мониторинг и резервирование.
    window_samples: 10             # скользящее окно замеров активного (10 × 30 с = 5 мин);
    min_availability: 50           # доступность в окне ниже порога (%) — то есть пятый
                                   # неуспешный замер, подряд или вразнобой, — переключение
                                   # сразу, не дожидаясь заполнения окна
    standby_probe_minutes: 5       # зонд резерва наружу — редко и с джиттером ±40 %:
                                   # строго периодический коннект с адреса шлюза —
                                   # сигнатура для ТСПУ; между зондами живость резерва —
                                   # по свежести хендшейка линка (локально, наружу ничего)

# Мониторинг co-located хоста: метрики железа (CPU/RAM/диск) бот читает сам
# (/proc + statvfs) каждый тик монитора; сюда — пороги/поведение алертов.
monitoring:
  alert_streak: 5                  # замеров подряд для срабатывания/отбоя ресурс-алерта
  service_failure_alert_loud: true # громкий алерт при устойчивом простое awg
  service_failure_alert_minutes: 5 # порог устойчивого простоя, мин

# Онлайн-детект: устройство «онлайн», если handshake свежее порога (секунды).
# Выравнено с интервалом опроса (5 мин): значение в БД может прокиснуть на возраст
# до целого интервала, порог меньше интервала давал бы ложный «оффлайн».
online_handshake_seconds: 300


# Фоновые интервалы APScheduler (минуты, если не указано иное)
scheduler:
  traffic_poll_minutes: 5          # опрос awg show dump
  expiry_check_minutes: 60         # проверка сроков + уведомления
  monitor_minutes: 3               # мониторинг статуса сервиса
  monthly_reset_day: 1             # сброс месячного трафика
  monthly_reset_hour: 0            # 00:00 по поясу бота
  backup_enabled: true             # автобэкап; выкл — раздел сворачивается до рубильника
  backup_channel: "telegram"       # telegram | email (на ящик бота, только шифрованные)
  backup_day: 1                    # автобэкап
  backup_hour: 12                  # 12:00 по поясу бота
  watcher_debounce_seconds: 2      # дебаунс inotify на пачку записей приложения
  # СЕКУНДЫ, а не минуты, и только на время переезда: такт задаёт задержку
  # поздравления «всё получилось», а оно ценно ровно тем, что приходит в момент,
  # когда человек смотрит на только что заработавшее подключение. Вне переезда
  # задание не делает ничего, внутри — ходит на один интерфейс и только пока
  # есть кого ждать.
  migration_watch_seconds: 20

# Льготные окна APScheduler (секунды): насколько «опоздавший» запуск ещё
# выполняется, а не считается пропущенным.
misfire_grace:
  interval_seconds: 120            # интервальные задачи и стартовые catch-up
  expiry_seconds: 300              # проверка сроков (важнее не пропустить)
  cron_seconds: 3600               # месячные cron-задачи (сброс/бэкап)

# Грациозный детект удаления app-устройства: сколько сверок подряд без peer'а
# в конфиге, прежде чем считать его удалённым (защита от гонки записи).
missing_sweeps_threshold: 2

# Аудит-история: закрытые эпизоды бизнес-процессов переезжают в *_histories и
# хранятся ограниченный срок, после чего вычищаются планировщиком батчами.
history:
  retention_years: 2               # сколько хранить историю (relativedelta years)
  purge_hour: 3                    # ежедневная очистка в 03:00 по поясу бота
  purge_batch_size: 500            # строк за один DELETE (батчинг, чтобы не лочить БД)

# Взаимный резерв серверов AWG (раздел «🛟 Резерв»). Горячие ключи: бот читает
# их по месту. Пороги живости и ожидания — в секундах и минутах.
reserve:
  ready: false                     # «Готов быть резервом» — симметричный тумблер
  return: immediate                # immediate | button — рычаг возврата пользователей на основу
  rf_via_mine: true                # РФ-доступ пользователей основы через мои шлюзы, если ни одного её шлюза нет на связи
  pair_cidr: "10.99.98.0/30"       # линк пары сервер ↔ сервер
  pair_port: 47101                 # UDP-порт линка пары на этом сервере (у второй стороны — свой)
  pair_channel_port: 8788          # TCP-порт канала пары внутри линка (канал шлюзов — 8787)
  zone_cidr: "169.254.77.0/30"     # veth хост ↔ гостевая зона (только в переезде)
  zone_rf_cidr: "169.254.77.4/30"  # второй veth — РФ-трафик пользователей основы к моим шлюзам
  zone_tg_cidr: "169.254.77.8/30"  # третий veth (постоянный) — выход агентов шлюзов основы в Telegram при мёртвом аплинке
  zone_pool: "169.254.96.0/19"     # NETMAP: подсеть каждого клона основы — на свой блок здесь (CAKE делит загрузку по устройствам)
  rsv_cidrs: ["10.99.97.0/30", "10.99.97.4/30"]   # постоянные линки шлюзов основы (стороны в зоне)
  suspect_seconds: 40              # тишина линка до подозрения
  probe_seconds: 15                # активная проба после подозрения
  rf_block_minutes: 15             # случаи 3 и Н3: столько подряд резерв видит основу, а её шлюзы на связи с ним — нет (или их нет)
  ask_seconds: 60                  # случаи 3 и Н3: столько ждём ответа основы на просьбу
  notify_online_minutes: 15        # уведомления пользователям — только устройствам на связи за столько минут
  pkg_minutes: 30                  # пакет по таймеру (± 40 %)
  min_interval_minutes: 30         # между переключением и возвратом «сразу»; у резерва — между автоматическими переездами
  relay_idle_hours: 2              # пересылка хвоста: тишина, после которой снимается
  relay_max_days: 7                # пересылка хвоста: не дольше
  tg_pool_asns: [62041, 62014, 59930, 44907, 211157]   # AS Telegram: проверка ядра и обучение пула вебхука
  tg_pool_url: "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS{asn}"
  tg_pool_hours: 24                # обновление кэша анонсов: раз в столько ± 40 %, только пока есть пара
                                   # (вне расписания — sudo awg-bot reserve tgpool refresh)
  tg_pool_max: 256                 # потолок выученных префиксов пула
  tg_pool_learn_syn: 3             # обучение: столько SYN на порт вебхука за 10 мин
  tg_pool_stale_days: 3            # анонсы не обновлялись дольше — уведомление и «⚠️» в строке пула
  quorum:                          # кворум: о переезде решает большинство — второй сервер и шлюзы основы (зонды в awg-quo)
    port: 8789                     # UDP-порт ответчика на втором адресе интерфейса AWG (8787 — канал шлюзов, 8788 — пары)
    probe_seconds: 15              # интервал пробы (± 40 %)
    no_seconds: 45                 # «не вижу»: ответа нет столько
    yes_window_seconds: 40         # окно «да» у лидера
    down_seconds: 20               # лишение кворума: «да» меньше половины столько
    up_seconds: 100                # решение кандидата: «нет» больше половины столько (≥ yes_window + down + 20)
    pledge_minutes: 10             # обязательство «нет» — не дольше
    tie_minutes: 3                 # ничья — тревога через столько
    act: true                      # решения по кворуму (без кнопки): false — только наблюдение и счёт в карточке
