# conf/app.yaml — инфраструктура приложения (не бизнес-правила).
# Секреты (BOT_TOKEN, ADMIN_ID) СЮДА НЕ КЛАДЁМ — они только из окружения/.env.
# Крипто-материал AWG (ключи, psk, обфускация awg-протокола, порт) тоже не тут — его читает
# live из контейнера awg.py, чтобы не заводить второй источник истины.

timezone: "Europe/Moscow"          # UTC+3, без переходов на летнее время

# Docker / AmneziaWG — deploy-параметры
docker:
  container: "amnezia-awg2"
  interface: "awg0"
  awg_dir: "/opt/amnezia/awg"

# Сеть: сервер занимает .0, клиенты идут с .1 (квирк докерной Amnezia)
network:
  subnet_prefix: "10.8.1"
  subnet_cidr: "10.8.1.0/24"     # информационное; harden_firewall.sh выводит
                                 # источник SSH-вайтлиста (bridge-подсеть) из docker
  ssh_port: 22                   # порт sshd хоста: общий для harden_firewall.sh
                                 # и пер-пирного фильтра в контейнере
  ip_host_start: 1                 # первый выдаваемый хост (.1); .0 — сервер
  ip_host_end: 254
  # ── ДЕПЛОЙ-ЗНАЧЕНИЯ ЭТОГО ХОСТА. Пустые в шаблоне — установщик заполнит под
  #    твои ответы (порт/подсеть подсосёт из живого awg-контейнера автодетектом,
  #    хост — из ip route как подсказку). В эксплуатации правишь здесь, на
  #    холодную. ОБЯЗАТЕЛЬНЫ — при пустом значении бот падает на старте с
  #    указанием, что задать. ─────────────────────────────────────────────────
  server_host: ""                  # внешний адрес awg-сервера (IP или домен)
  server_port:                     # порт awg-сервера (у докерной Amnezia случайный)

# Параметры клиентского конфига (из эталонного vpn:// приложения)
client_config:
  dns1: "1.1.1.1"
  dns2: "1.0.0.1"
  mtu: 1376
  keepalive_seconds: 25            # PersistentKeepalive
  allowed_ips: "0.0.0.0/0, ::/0"   # полный туннель на стороне клиента
  server_name: "Сервер 1"          # description в vpn:// (видно в приложении)

# ── Условная маршрутизация (см. docs/conditional-routing.md) ─────────────────
# Российский IP для российских сервисов: помеченный трафик уходит линк-туннелем
# на шлюз с РФ-адресом, остальное — обычным путём с этого сервера. Конфиги
# устройств при этом НЕ меняются: режим — серверное состояние, а не отдельные
# учётные данные.
#
# Пустой gw_interface ⇒ фича СПИТ целиком: тумблеры не показываются, наборы не
# создаются, планировщик её не трогает. Это же и аварийный рубильник.
routing:
  # ГОРЯЧИЙ выключатель функции — правится из «⚙️ Настройки → Условная
  # маршрутизация», применяется без рестарта. Выключение снимает маркировку и
  # чистит наборы, но пользовательские настройки (разрешения, тумблеры, списки)
  # сохраняет: включил обратно — всё вернулось как было.
  enabled: false
  gw_interface: ""                 # интерфейс линк-туннеля до шлюза (напр. "awggw")
  # ДВА ПЛЕЧА. Контейнер Amnezia работает в режиме bridge (свой сетевой
  # namespace), а ipset — сущность per-netns: набор, созданный внутри контейнера,
  # для dnsmasq на хосте не существует. Поэтому:
  #   • в КОНТЕЙНЕРЕ — только исключения из MASQUERADE (по правилу на включённое
  #     устройство). ipset там не нужен вовсе;
  #   • на ХОСТЕ — наборы, маркировка, ip rule, dnsmasq и линк до шлюза. У
  #     выпущенного немаскараженным трафика виден настоящий 10.8.1.x, у прочего —
  #     bridge-адрес контейнера, так что различение достаётся даром.
  client_subnet: "10.8.1.0/24"     # подсеть клиентов: по ней хост отличает
                                   # немаскараженный трафик включённых устройств
  table: 100                       # номер таблицы маршрутизации для помеченного
  fwmark: 1                        # метка (маска та же — бит не затирает чужие)
  #
  # ЛОГИКА ОТ ОБРАТНОГО. Набор описывает то, чему нужен ЗАРУБЕЖНЫЙ адрес
  # (заблокированное). Всё, чего в нём НЕТ, уходит на шлюз и выходит с
  # российского. Так российский IP получает любой сервис — в том числе на .com, —
  # не дожидаясь, пока его внесут в список вручную. Списки бот качает САМ (при
  # старте и по расписанию): подсети попадают в наборы напрямую, без DNS,
  # поэтому основной путь не зависит от резолвера.
  #
  # У КАЖДОГО ПРОФИЛЯ СВОЙ НАБОР = базовый список + его личные исключения.
  # Общего набора рядом с личными нет намеренно: dnsmasq применяет для домена
  # только ОДНУ директиву ipset=, и домен из базы, добавленный кем-то себе,
  # переставал бы попадать в общий — у остальных он уезжал бы на шлюз.
  #
  # ИМЁН НАБОРОВ И ЦЕПОЧЕК ЗДЕСЬ НЕТ намеренно — они константы в коде. Возможность
  # их настраивать создавала рассинхрон: боевой конфиг при обновлении не
  # мигрирует, и однажды прописанное имя переживало смену схемы, после чего бот
  # искал набор, которого никто не создаёт.
  # Источники базового набора. Бот обновляет его САМ — при старте и по
  # расписанию; руками ничего запускать не нужно. Подсети грузятся напрямую в
  # ipset (без DNS), домены — через отдельный файл dnsmasq.
  lists_refresh_hours: 6            # как часто обновлять
  lists_domains_url: "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-dnsmasq-ipset.lst"
  lists_subnet_urls:
    - "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/telegram.lst"
    - "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/meta.lst"
    - "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/twitter.lst"
    - "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/cloudflare.lst"
    - "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Subnets/IPv4/discord.lst"
    - "https://www.gstatic.com/ipranges/goog.json"
  dnsmasq_conf: "/etc/dnsmasq.d/awgbot-routing.conf"   # генерится ботом ЦЕЛИКОМ
  dnsmasq_service: "dnsmasq"       # unit для restart (reload не применяет ipset=)
  user_domains_max: 100            # потолок личного списка на клиента
  # Домены, запрещённые к добавлению в личный список (совпадение по суффиксу:
  # запрет на X закрывает и mail.X). Собственная инфраструктура добавляется сюда
  # автоматически из server_host и почтовых хостов — здесь только доп.записи.
  denylist: []
  # ЖИВОСТЬ ШЛЮЗА измеряется проходимостью, а не состоянием туннеля: бот пингует
  # probe_target ЧЕРЕЗ линк. Возраст хендшейка отвечал бы на другой вопрос —
  # «поднят ли туннель», — а у шлюза может быть поднят туннель и лежать аплинк.
  # ЗЕРКАЛЬНЫЙ СЛУЧАЙ к спискам блокировок: сервисы, которые сами отказывают
  # российским адресам. Россия их не блокирует, значит ни в один скачиваемый
  # список они не попадают — а при инверсии логики ломаются первыми: домен
  # уходит на шлюз и получает ровно тот адрес, который ему закрыт.
  # Основной источник — сопровождаемая категория geoblock того же репозитория,
  # что и списки блокировок (URL в config.ROUTING_LISTS_GEOBLOCK_URL, ключ
  # lists_geoblock_url). Домены оттуда ложатся в тот же кэш, что и блокировки:
  # для нас оба случая означают одно — этому домену нужен зарубежный адрес.
  #
  # config.ROUTING_ABROAD_DOMAINS — небольшое ДОПОЛНЕНИЕ к нему на то, чего в
  # источнике нет, и запас на случай, когда список ещё не скачался. Ключ ниже
  # его ЗАМЕНЯЕТ (не дополняет) — копируй целиком, если правишь.
  # abroad_domains: ["example.com", "example.com", ...]

  # НЕСКОЛЬКО целей, а не одна: единственный внешний хост сам по себе точка
  # отказа — он может лечь или подтормаживать, и мы объявим отказом шлюза чужую
  # проблему. Успех любой означает, что путь наружу есть.
  probe_targets: ["77.88.8.8", "8.8.8.8"]
  probe_target: "77.88.8.8"        # устаревший ключ на одну цель (для старых conf)
  probe_port: 53                   # TCP, а не ICMP: пинг проверял бы путь,
                                   # который на шлюзе никто не настраивал
  probe_seconds: 30                # такт проверки; он же — предел провала
                                   # (деградация: маркировка снимается)

# Мониторинг co-located хоста: метрики железа (CPU/RAM/диск) бот читает сам
# (/proc + statvfs) каждый тик монитора; сюда — пороги/поведение алертов.
monitoring:
  alert_streak: 5                  # замеров подряд для срабатывания/отбоя ресурс-алерта
  service_failure_alert_loud: true # громкий алерт при устойчивом простое awg
  service_failure_alert_minutes: 5 # порог устойчивого простоя, мин

# Онлайн-детект: устройство «онлайн», если handshake свежее порога (секунды).
# Выравнено с интервалом опроса (5 мин): значение в БД может прокиснуть на возраст
# до целого интервала, порог меньше интервала давал бы ложный «оффлайн».
online_handshake_seconds: 300


# Фоновые интервалы APScheduler (минуты, если не указано иное)
scheduler:
  traffic_poll_minutes: 5          # опрос awg show dump
  expiry_check_minutes: 60         # проверка сроков + уведомления
  monitor_minutes: 3               # мониторинг статуса контейнера/сервиса
  monthly_reset_day: 1             # сброс месячного трафика
  monthly_reset_hour: 0            # 00:00 UTC+3
  backup_day: 1                    # автобэкап
  backup_hour: 12                  # 12:00 UTC+3
  watcher_debounce_seconds: 2      # дебаунс inotify на пачку записей приложения

# Льготные окна APScheduler (секунды): насколько «опоздавший» запуск ещё
# выполняется, а не считается пропущенным.
misfire_grace:
  interval_seconds: 120            # интервальные задачи и стартовые catch-up
  expiry_seconds: 300              # проверка сроков (важнее не пропустить)
  cron_seconds: 3600               # месячные cron-задачи (сброс/бэкап)

# Грациозный детект удаления app-устройства: сколько сверок подряд без peer'а
# в конфиге, прежде чем считать его удалённым (защита от гонки записи).
missing_sweeps_threshold: 2

# Аудит-история: закрытые эпизоды бизнес-процессов переезжают в *_histories и
# хранятся ограниченный срок, после чего вычищаются планировщиком батчами.
history:
  retention_years: 2               # сколько хранить историю (relativedelta years)
  purge_hour: 3                    # ежедневная очистка в 03:00 UTC+3
  purge_batch_size: 500            # строк за один DELETE (батчинг, чтобы не лочить БД)
