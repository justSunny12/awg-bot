# conf/notifications.yaml — тумблеры уведомлений АДМИНУ о событиях пользователей.
# Каждое событие можно выключить независимо; выключенное просто не шлётся админу
# (на пользователя/друга это не влияет). Все применяются на горячую.

client_events:
  activation: true      # пользователь активировал инвайт (новый друг подключился)
  grace: true           # пользователь сам продлился на пару недель (grace)
  over_limit: true      # пользователь превысил месячный лимит трафика
  bonus: true           # пользователю выдана разовая бонус-квота при превышении
# Критичные алерты админу на почту, когда Telegram не отвечает (нужен ящик,
# ⚙️ Настройки → ✉️ E-mail). Только критика: падение сервиса, шлюз, перегруз.
email_fallback: false
