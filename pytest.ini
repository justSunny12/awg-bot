[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q -n auto
# временные каталоги тестов (tmp_path) — только упавших и только последнего прогона: полный прогон
# оставлял ~1,4 ГБ, параллельные прогоны деревьев копили их десятками ГБ (каталог идущего прогона
# pytest не трогает — на нём его блокировка)
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
markers =
    unit: изолированные тесты чистой логики (без БД, сети и сервера)
    smoke: быстрые проверки импорта и сборки
    integration: с реальной временной БД и фейковым awg-слоем
    e2e: сквозные бизнес-сценарии
    screens: эталоны экранов через настоящий диспетчер роли (tests/screens)
